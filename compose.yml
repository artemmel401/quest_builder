version: '3'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db

  mongo-seed:
    build: ./mongo-seed
    links:
      - mongodb
    volumes:
      - ./mongo-seed:/docker-entrypoint-initdb.d
    depends_on:
      - mongodb

volumes:
  mongo-data: